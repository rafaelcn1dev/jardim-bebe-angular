name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Permite apenas um deploy concorrente
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # npm tem um bug com dependencias opcionais nativas (ex.: rollup) quando o
      # package-lock.json foi gerado em outra plataforma. Regenerar o lock no
      # runner Linux garante o binario @rollup/rollup-linux-x64-gnu.
      # https://github.com/npm/cli/issues/4828
      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Build
        run: npm run build -- --base-href=/jardim-bebe-angular/

      - name: Add SPA fallback (404.html)
        run: cp dist/jardim-bebe/browser/index.html dist/jardim-bebe/browser/404.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/jardim-bebe/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
