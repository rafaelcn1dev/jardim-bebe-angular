services:
  - type: web
    name: jardim-bebe-angular
    runtime: static
    repo: https://github.com/rafaelcn1dev/jardim-bebe-angular
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist/jardim-bebe/browser

    # Roteamento SPA: toda rota desconhecida serve o index.html (sem mudar a URL)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    # Headers de seguranca aplicados a todas as respostas
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline';
          img-src 'self' data:;
          font-src 'self';
          media-src 'self' https: blob:;
          connect-src 'self' https://jardim-bebe-sound-server.onrender.com;
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none';
          object-src 'none'
